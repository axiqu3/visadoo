[build]
  publish = "."

# Inject editable global SEO into the homepage
[[edge_functions]]
  path = "/"
  function = "home"

# Server-rendered country pages (list a country's visas)
[[edge_functions]]
  path = "/country/*"
  function = "country"

# Server-rendered, SEO-friendly pages for each visa type
[[edge_functions]]
  path = "/visa/*"
  function = "visa"

# Server-rendered Events page (browse international events by month/category)
[[edge_functions]]
  path = "/events"
  function = "events"

[[edge_functions]]
  path = "/events.html"
  function = "events"

# Server-rendered individual event pages (event details + that country's visas)
[[edge_functions]]
  path = "/event/*"
  function = "event"

# Server-rendered articles list and individual article pages
[[edge_functions]]
  path = "/articles"
  function = "articles"

[[edge_functions]]
  path = "/articles.html"
  function = "articles"

[[edge_functions]]
  path = "/article/*"
  function = "articles"

# Custom pages (About, Terms, …)
[[edge_functions]]
  path = "/p/*"
  function = "page"

# Auto-generated sitemap
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# Global Enterprise Security Headers across all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://translate.google.com https://translate.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://api.openai.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://flagcdn.com https://images.unsplash.com https://tessdata.projectnaptha.com https://wa.me https://translate.googleapis.com https://translate.google.com; frame-src 'self' https://*.supabase.co https://translate.google.com; frame-ancestors 'self'; worker-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me;"

# Sensitive authenticated app route — strictly private, no shared caching
[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# Serverless API endpoints
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Always serve the freshest code/markup so a stale cached file can never
# make a form (or any feature) silently run an out-of-date version.
# Browsers revalidate on each load and get a tiny "304 Not Modified" when unchanged.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
