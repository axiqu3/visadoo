<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visa Doo — Your Application</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><path d='M50 22l24 38H26z' fill='white' transform='rotate(45 50 50)'/></svg>">
<link rel="stylesheet" href="styles.css?v=20260910-searchbar-clean-v2">
<link rel="stylesheet" href="app.css?v=20260914-mobile-fix-v16">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css" integrity="sha384-UDMQHRM0EUD2c68CHqfyyPlOx2KLZATDx+EmYoFoe46efuSWyIl+lGJIZ1rNZNBk" crossorigin="anonymous">
<script src="branding.js?v=20260914-gt-fix-v1"></script>
</head>
<body>
<header class="header discover-header" id="mainHeader">
  <div class="container nav">
    <div class="nav-brand-cluster">
      <a href="index.html#top" class="brand notranslate" translate="no"><img src="assets/logo_transparent.png" alt="Visa Doo" class="brand-logo-img"></a>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link">Home</a>
      <a href="events/events.html" class="nav-link">Activities</a>
    </nav>
    <div class="nav-actions" id="headerActions">
      <!-- Nationality Dropdown -->
      <div class="header-dropdown notranslate" translate="no" id="nationalityDropdown">
        <button class="header-dropdown-trigger notranslate" translate="no" type="button" aria-haspopup="listbox" aria-expanded="false">
          <img src="https://flagcdn.com/w40/in.png" class="dropdown-flag notranslate" id="selectedNationalityFlag" alt="">
          <span id="selectedNationalityText" class="notranslate" translate="no">India</span>
          <span class="dropdown-chevron"></span>
        </button>
        <div class="header-dropdown-menu nat-luxury-modal notranslate" role="listbox">
          <div class="nat-modal-top-bar">
            <div class="nat-modal-header-text">
              <h3 class="nat-modal-title">I’m from</h3>
              <p class="nat-modal-sub">Choose a destination to see available visas.</p>
            </div>
            <button type="button" class="nat-modal-close" id="natModalClose" aria-label="Close">✕</button>
          </div>
          <div class="header-dropdown-search">
            <input type="text" placeholder="Search destination..." class="dropdown-search-input nat-dest-search-input" id="nationalitySearchInput" autocomplete="off">
          </div>
          <div class="dropdown-options-list nat-feed-list nat-dest-list">
            <!-- Destination items populated dynamically by branding.js -->
          </div>
        </div>
      </div>

      <!-- Profile Button -->
      <button class="nav-profile app-header-profile active" data-go="profile" type="button" aria-label="Profile" title="Profile">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>

      <!-- Mobile Menu Button -->
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="appRoot"><!-- views render here --></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js" integrity="sha384-yBFGFm4wGegLo3IhElO5lgZx6F5I3Y3ccEHNnxS8qUeaXGcl7FNm3KDxx3HU4dhm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js" integrity="sha384-2BQ3U3OdKOb0Uczxqr41I9UvZkzr4V9Hv8uSzMMZAlmhsFClvdZX5wi5fDCzG+tM" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="config.js?v=20260914-v1"></script>
<script src="destination-images.js?v=20260911-images-v2"></script>
<script src="security.js?v=20260901-security-v1"></script>
<script src="application.js?v=20260914-mobile-fix-v16"></script>
</body>
</html>
