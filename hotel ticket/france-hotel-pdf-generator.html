<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leonardo Hotel Reservation PDF Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#182033}
.wrap{max-width:980px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001;margin-bottom:18px}
h1{margin:0 0 8px}.note{font-size:13px;color:#596274;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd3df;border-radius:8px;font-size:14px}
.btn{border:0;background:#54104f;color:white;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Hotel Reservation PDF Generator</h1>
    <div class="note">Original PDF is used as the background. Text is added as vector PDF text, so the downloaded PDF keeps the original quality. Customer details are auto-filled from the application.</div>
    <div style="margin-top:14px"><button type="button" class="btn" style="background:#eef1f7;color:#182033" onclick="goBackToApplication()">← Back to application</button></div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>Reservation Number</label><input id="reservation" placeholder="980000000" readonly></div>
      <div><label>Guest Name</label><input id="guest" placeholder="SALWA MOHAMMAD ARSHED"></div>
      <div><label>Rating</label><input id="rating" placeholder="89" value="89"></div>

      <div><label>Check-In</label><input id="checkin" type="date"></div>
      <div><label>Check-Out</label><input id="checkout" type="date"></div>
      <div><label>Adults</label><input id="adults" type="number" min="1" value="1"></div>

      <div><label>Total Price (EUR)</label><input id="price" type="number" min="0" step="0.01" placeholder="2358.00"></div>
    </div>
  </div>

  <div class="card">
    <button class="btn" onclick="generatePDF()">Generate & Download PDF</button>
  </div>
</div>

const $ = id => (document.getElementById(id)?.value || '').trim();

// Reservation number: first 4 digits always stay 9800; last 5 digits change.
function generateReservationNumber(){
  let n;
  if(window.crypto && crypto.getRandomValues){
    const a=new Uint32Array(1);
    crypto.getRandomValues(a);
    n=a[0] % 100000;
  }else{
    n=Math.floor(Math.random()*100000);
  }
  const reservation='9800'+String(n).padStart(5,'0');
  const el=document.getElementById('reservation');
  if(el) el.value=reservation;
  return reservation;
}

// Same auto-fill style as the supplied model code.
// Supports a hotel-specific storage key and also the existing flight/application key.
function loadVisaDooData(){
  let data={};
  const keys=['visadoo-hotel-pdf-data','visadoo-flight-pdf-data'];
  for(const key of keys){
    try{
      const d=JSON.parse(sessionStorage.getItem(key)||'{}')||{};
      if(d && Object.keys(d).length){ data={...data,...d}; }
    }catch(_e){}
  }
  const set=(id,v)=>{
    const el=document.getElementById(id);
    if(el && v!==undefined && v!==null && String(v).trim()) el.value=String(v).trim();
  };

  set('guest', data.guest_name || data.passenger_name || data.customer_name || data.full_name || data.name);
  set('checkin', data.checkin || data.check_in || data.outbound_date || data.travel_date || data.arrival_date);
  set('checkout', data.checkout || data.check_out || data.return_date || data.departure_date);
  set('adults', data.adults || data.adult_count || data.number_of_adults);
  set('price', data.total_price || data.price || data.hotel_price);
  set('rating', data.rating);
}

function goBackToApplication(){
  let data={};
  try{data=JSON.parse(sessionStorage.getItem('visadoo-hotel-pdf-data')||sessionStorage.getItem('visadoo-flight-pdf-data')||'{}')||{};}catch(_e){}
  if(data.return_hash){ window.location.href='../app.html#'+data.return_hash; }
  else if(history.length>1){ history.back(); }
  else { window.location.href='../app.html'; }
}

// Generate a fresh reservation number every time this generator is opened,
// then fill customer/date details passed from the application.
generateReservationNumber();
loadVisaDooData();

function base64ToUint8Array(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function hotelDate(v){
  if(!v) return '';
  const d = new Date(v + 'T00:00:00');
  const week = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const month = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${week[d.getDay()]}, ${month[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function nightsBetween(a,b){
  if(!a || !b) return '';
  const x = new Date(a+'T00:00:00');
  const y = new Date(b+'T00:00:00');
  const n = Math.round((y-x)/86400000);
  return n > 0 ? n : '';
}

function euroPrice(v){
  if(v === '') return '';
  const n = Number(v);
  if(!Number.isFinite(n)) return '';
  return '€' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}


function currentDateTimeText(){
  const d = new Date();
  const date = d.toLocaleDateString('en-US',{
    month:'numeric',
    day:'numeric',
    year:'2-digit'
  });
  const time = d.toLocaleTimeString('en-US',{
    hour:'numeric',
    minute:'2-digit',
    hour12:true
  });
  return `${date}, ${time}`;
}

async function generatePDF(){
  try{
    if(typeof PDFLib === 'undefined') throw new Error('PDF library did not load. Please connect to the internet once and reopen this page.');

    const reservation=$('reservation');
    const guest=$('guest');
    const checkin=$('checkin');
    const checkout=$('checkout');
    const adults=$('adults');
    const price=$('price');
    const rating=$('rating');

    if(!reservation || !guest || !checkin || !checkout || !adults || !price){
      alert('Please fill Reservation Number, Guest Name, Check-In, Check-Out, Adults and Total Price.');
      return;
    }

    const nights=nightsBetween(checkin,checkout);
    if(!nights){ alert('Check-Out must be after Check-In.'); return; }

    const pdfDoc = await PDFLib.PDFDocument.load(base64ToUint8Array(TEMPLATE_PDF_BASE64), { updateMetadata:false });
    const page = pdfDoc.getPages()[0];
    const normal = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

    const rgb=PDFLib.rgb;
    const dark=rgb(0.12,0.12,0.12);
    const grey=rgb(0.42,0.42,0.42);
    const red=rgb(0.73,0.05,0.20);

    function fit(text,font,size,maxWidth,minSize=7){
      let s=size;
      while(font.widthOfTextAtSize(text,s)>maxWidth && s>minSize) s-=0.25;
      return s;
    }
    function draw(text,x,y,size=9,font=normal,color=dark,maxWidth=999){
      text=String(text||''); if(!text) return;
      const s=fit(text,font,size,maxWidth);
      page.drawText(text,{x,y,size:s,font,color});
      return {size:s,width:font.widthOfTextAtSize(text,s)};
    }

    // Automatic current date & time at top-left of PDF
    draw(currentDateTimeText(),28,775.0,7.4,normal,dark,120);

    // Reservation number - exact area from the filled reference PDF.
    const rn=draw(reservation,341,690,10.2,bold,dark,102);
    if(rn) page.drawLine({start:{x:341,y:688.7},end:{x:341+rn.width,y:688.7},thickness:0.65,color:dark});

    // Rating in the white rating square.
    draw(rating,47.4,538.0,8.5,normal,grey,20);

    // Main reservation details.
    draw(guest.toUpperCase(),39.3,480.0,8.7,bold,dark,145);
    draw(hotelDate(checkin),217.0,480.0,8.7,bold,dark,145);
    draw(hotelDate(checkout),497.0,480.0,8.7,bold,dark,102);

    // Nights line in Leonardo red.
    draw(`${nights} Night${Number(nights)===1?'':'s'}`,39.0,450.1,8.8,bold,red,85);

    // Room guest count line.
    draw(`${adults} Adult${Number(adults)===1?'':'s'}`,39.0,385.3,10,bold,dark,90);

    // Price appears twice in the reference: black summary + red Total Price value.
    const p=euroPrice(price);
    draw(p,508.0,161.7,14.0,bold,dark,82);
    draw(p,508.0,125.3,14.0,bold,red,82);

    // Keep original vector/background content and annotations intact.
    const out=await pdfDoc.save({useObjectStreams:false});
    const blob=new Blob([out],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=(reservation||'HOTEL_RESERVATION')+'_FILLED.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    setTimeout(()=>generateReservationNumber(),250);
  }catch(e){
    console.error(e);
    alert('PDF generation failed: '+e.message);
  }
}
</script>
