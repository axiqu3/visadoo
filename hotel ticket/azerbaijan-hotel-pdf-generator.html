<title>Mövenpick Hotel Reservation PDF Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#182033}
.wrap{max-width:1000px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001;margin-bottom:18px}
h1{margin:0 0 8px}h2{font-size:18px;margin-top:0}
.note{font-size:13px;color:#596274;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd3df;border-radius:8px;font-size:14px}
.btn{border:0;background:#54104f;color:white;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>

<div class="wrap">
<div class="card">
<h1>Mövenpick Hotel Reservation PDF Generator</h1>
<div class="note">Original 2-page PDF is preserved as the template. Customer details can auto-fill from the application.</div>
<div style="margin-top:14px"><button class="btn" style="background:#eef1f7;color:#182033" onclick="goBackToApplication()">← Back to application</button></div>
</div>

<div class="card"><h2>Reservation</h2><div class="grid">
<div><label>Reservation Number</label><input id="reservation" readonly></div>
<div><label>Guest Name</label><input id="guest" placeholder="SARAH KHALED MOHAMMED ALMALEKI"></div>
<div><label>Email</label><input id="email" placeholder="SKYBOOKFATHIMA@GMAIL.COM"></div>
<div><label>Check-In</label><input id="checkin" type="date"></div>
<div><label>Check-Out</label><input id="checkout" type="date"></div>
<div><label>Adults</label><input id="adults" type="number" min="1" value="1"></div>
<div><label>Check-In Time</label><input id="checkintime" value="3:00 PM"></div>
<div><label>Check-Out Time</label><input id="checkouttime" value="12:00 PM"></div>
<div><label>Room Price (USD)</label><input id="price" type="number" step="0.01" placeholder="1003.83"></div>
</div></div>

<div class="card"><button class="btn" onclick="generatePDF()">Generate & Download PDF</button></div>
</div>

const $=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

function makeReservation(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let tail='';
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(4);crypto.getRandomValues(a);
    for(let i=0;i<4;i++)tail+=chars[a[i]%chars.length];
  }else{
    for(let i=0;i<4;i++)tail+=chars[Math.floor(Math.random()*chars.length)];
  }
  const v='QQCH'+tail;
  document.getElementById('reservation').value=v;
  return v;
}

function loadVisaDooData(){
  let data={};
  for(const key of ['visadoo-hotel-pdf-data','visadoo-flight-pdf-data','visadoo-pdf-data','visadoo-application-data']){
    try{const d=JSON.parse(sessionStorage.getItem(key)||'{}')||{};if(Object.keys(d).length)data={...data,...d};}catch(_e){}
  }
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!==undefined&&v!==null&&String(v).trim()!=='')e.value=String(v).trim();};
  set('guest',data.guest_name||data.passenger_name||data.customer_name||data.full_name||data.applicant_name||data.name);
  set('email',data.email||data.mail_id||data.customer_email||data.applicant_email);
  set('checkin',data.checkin||data.check_in||data.check_in_date||data.outbound_date||data.travel_date||data.arrival_date);
  set('checkout',data.checkout||data.check_out||data.check_out_date||data.return_date||data.departure_date);
  set('adults',data.adults||data.adult_count||data.number_of_adults);
  set('price',data.room_price_usd||data.total_price_usd||data.usd_price||data.hotel_price_usd||data.price);
}

function goBackToApplication(){
  let data={};try{data=JSON.parse(sessionStorage.getItem('visadoo-hotel-pdf-data')||'{}')||{};}catch(_e){}
  if(data.return_hash)window.location.href='../app.html#'+data.return_hash;
  else if(history.length>1)history.back();
  else window.location.href='../app.html';
}

function bytes(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

function currentDateTime(){
  const d=new Date();
  const date=d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
  const time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  return `${date}, ${time}`;
}

function longDate(v){
  if(!v)return '';
  const d=new Date(v+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

function nights(a,b){
  if(!a||!b)return 0;
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}

function priceUS(v){
  const n=Number(v);if(!Number.isFinite(n))return '';
  return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+'$US';
}

async function generatePDF(){
try{
  if(!window.PDFLib)throw new Error('PDF library could not load.');
  const guest=$('guest'),email=$('email'),cin=$('checkin'),cout=$('checkout'),adult=Number($('adults'))||1;
  if(!guest||!email||!cin||!cout){alert('Please fill Guest Name, Email, Check-In and Check-Out.');return;}
  const ns=nights(cin,cout);if(ns<=0){alert('Check-Out must be after Check-In.');return;}

  const pdf=await PDFLib.PDFDocument.load(bytes(TEMPLATE_PDF_BASE64),{updateMetadata:false});
  const p=pdf.getPages(); if(p.length<2)throw new Error('Template must have 2 pages.');
  const p1=p[0],p2=p[1];
  const normal=await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
  const bold=await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const dark=PDFLib.rgb(.10,.10,.14), grey=PDFLib.rgb(.38,.38,.42), white=PDFLib.rgb(1,1,1);

  function fit(t,f,s,m,min=6){while(f.widthOfTextAtSize(t,s)>m&&s>min)s-=.25;return s;}
  function draw(page,t,x,y,s=9,f=normal,c=dark,max=999){
    t=String(t||'').trim();if(!t)return null;const z=fit(t,f,s,max);
    page.drawText(t,{x,y,size:z,font:f,color:c});return {size:z,width:f.widthOfTextAtSize(t,z)};
  }
  function right(page,t,xr,y,s=9,f=normal,c=dark,max=120){
    t=String(t||'').trim();if(!t)return;const z=fit(t,f,s,max),w=f.widthOfTextAtSize(t,z);
    page.drawText(t,{x:xr-w,y,size:z,font:f,color:c});
  }

  const stamp=currentDateTime(),res=$('reservation'),G=guest.toUpperCase();

  // PAGE 1 - date/time
  draw(p1,stamp,9,779,7.4,normal,dark,120);

  // Dynamic name in the large "Thank you ..." heading.
  // White cover only over the original name line, preserving the rest of the template.
  p1.drawRectangle({x:42,y:618,width:520,height:25,color:white});
  draw(p1,`Thank you ${G} !`,42,627,17.4,bold,dark,520);

  // Confirmation email
  draw(p1,email.toUpperCase(),405,524,8.2,bold,dark,180);

  // Reservation number
  draw(p1,res,196,425,8.0,bold,grey,90);

  // Nights / occupancy / reservation name
  draw(p1,`${ns} night${ns===1?'':'s'}`,47,388,8.4,bold,dark,80);
  draw(p1,`1 Room | ${adult} adult${adult===1?'':'s'}`,47,368,10.3,bold,dark,150);
  draw(p1,G,158,348,8.0,bold,dark,220);

  // FROM / TO
  draw(p1,longDate(cin),47,283,11.3,bold,dark,235);
  draw(p1,`Check-in ${$('checkintime')}`,47,263,8.8,normal,grey,180);
  draw(p1,longDate(cout),47,200,11.3,bold,dark,235);
  draw(p1,`Check-out ${$('checkouttime')}`,47,180,8.8,normal,grey,180);

  // PAGE 2 - date/time
  draw(p2,stamp,9,779,7.4,normal,dark,120);

  // Hotel address missing in blank template
  draw(p2,'210 Mirzaagha Aliyev street, Nasimi district',47,678,8.7,normal,dark,260);
  draw(p2,'1014 BAKU',47,663,8.7,normal,dark,140);
  draw(p2,'AZERBAIJAN',47,648,8.7,normal,dark,140);

  // Room occupancy and price
  draw(p2,`${adult} adult${adult===1?'':'s'}`,47,445,8.7,normal,dark,90);
  right(p2,priceUS($('price')),568,461,10.2,bold,dark,120);

  const out=await pdf.save({useObjectStreams:false});
  const blob=new Blob([out],{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(res||'MOVENPICK_HOTEL')+'_FILLED.pdf';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  setTimeout(makeReservation,250);
}catch(e){console.error(e);alert('PDF generation failed: '+e.message);}
}
