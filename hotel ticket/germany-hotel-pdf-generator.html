<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leonardo Heidelberg Hotel Reservation PDF Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#182033}
.wrap{max-width:980px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001;margin-bottom:18px}
h1{margin:0 0 8px}.note{font-size:13px;color:#596274;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd3df;border-radius:8px;font-size:14px}
.btn{border:0;background:#54104f;color:white;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Leonardo Heidelberg - Hotel Reservation PDF Generator</h1>
    <div class="note">Customer details are auto-filled from the application. The original blank PDF remains the template, so PDF quality is preserved.</div>
    <div style="margin-top:14px">
      <button type="button" class="btn" style="background:#eef1f7;color:#182033" onclick="goBackToApplication()">← Back to application</button>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>Reservation Number</label><input id="reservation" readonly></div>
      <div><label>Guest Name</label><input id="guest" placeholder="KHALED MOHAMMED AWAD ALMALEKI"></div>
      <div><label>Rating</label><input id="rating" value="84"></div>

      <div><label>Check-In</label><input id="checkin" type="date"></div>
      <div><label>Check-Out</label><input id="checkout" type="date"></div>
      <div><label>Adults</label><input id="adults" type="number" min="1" value="1"></div>

      <div><label>Children</label><input id="children" type="number" min="0" value="0"></div>
      <div><label>Total Price (EUR)</label><input id="eurprice" type="number" min="0" step="0.01" placeholder="4225.50"></div>
      <div><label>Total Price (USD)</label><input id="usdprice" type="number" min="0" step="0.01" placeholder="4881.30"></div>
    </div>
  </div>

  <div class="card">
    <button class="btn" onclick="generatePDF()">Generate & Download PDF</button>
  </div>
</div>

function generateReservationNumber(){
  let n;
  if(window.crypto && crypto.getRandomValues){
    const a=new Uint32Array(1);
    crypto.getRandomValues(a);
    n=a[0] % 100000;
  }else{
    n=Math.floor(Math.random()*100000);
  }
  const value='9800'+String(n).padStart(5,'0');
  document.getElementById('reservation').value=value;
  return value;
}

function loadVisaDooData(){
  let data={};
  const keys=['visadoo-hotel-pdf-data','visadoo-flight-pdf-data','visadoo-pdf-data','visadoo-application-data'];
  for(const key of keys){
    try{
      const d=JSON.parse(sessionStorage.getItem(key)||'{}')||{};
      if(d && Object.keys(d).length) data={...data,...d};
    }catch(_e){}
  }

  const set=(id,v)=>{
    const el=document.getElementById(id);
    if(el && v!==undefined && v!==null && String(v).trim()!=='') el.value=String(v).trim();
  };

  set('guest',
    data.guest_name || data.passenger_name || data.customer_name ||
    data.full_name || data.applicant_name || data.name
  );
  set('checkin',
    data.checkin || data.check_in || data.check_in_date ||
    data.outbound_date || data.travel_date || data.arrival_date
  );
  set('checkout',
    data.checkout || data.check_out || data.check_out_date ||
    data.return_date || data.departure_date
  );
  set('adults',
    data.adults || data.adult_count || data.number_of_adults
  );
  set('children',
    data.children ?? data.child_count ?? data.number_of_children
  );
  set('eurprice',
    data.eur_price || data.total_price_eur || data.hotel_price_eur ||
    data.total_price || data.price || data.hotel_price
  );
  set('usdprice',
    data.usd_price || data.total_price_usd || data.hotel_price_usd
  );
  set('rating', data.rating || data.hotel_rating);
}

function goBackToApplication(){
  let data={};
  try{
    data=JSON.parse(
      sessionStorage.getItem('visadoo-hotel-pdf-data') ||
      sessionStorage.getItem('visadoo-flight-pdf-data') || '{}'
    )||{};
  }catch(_e){}
  if(data.return_hash) window.location.href='../app.html#'+data.return_hash;
  else if(history.length>1) history.back();
  else window.location.href='../app.html';
}

function base64ToUint8Array(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function hotelDate(v){
  if(!v) return '';
  const d=new Date(v+'T00:00:00');
  const week=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const month=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${week[d.getDay()]}, ${month[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function nightsBetween(a,b){
  if(!a || !b) return '';
  const x=new Date(a+'T00:00:00');
  const y=new Date(b+'T00:00:00');
  const n=Math.round((y-x)/86400000);
  return n>0 ? n : '';
}

function money(v,currency){
  const n=Number(v);
  if(!Number.isFinite(n)) return '';
  const symbol=currency==='USD' ? '$' : '€';
  return symbol+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function guestCountText(adults,children){
  const a=Number(adults)||0, c=Number(children)||0;
  const parts=[];
  if(a) parts.push(`${a} Adult${a===1?'':'s'}`);
  if(c) parts.push(`${c} Child${c===1?'':'ren'}`);
  return parts.join(', ');
}


function currentDateTimeText(){
  const d = new Date();
  const date = d.toLocaleDateString('en-US',{
    month:'numeric',
    day:'numeric',
    year:'2-digit'
  });
  const time = d.toLocaleTimeString('en-US',{
    hour:'numeric',
    minute:'2-digit',
    hour12:true
  });
  return `${date}, ${time}`;
}

async function generatePDF(){
  try{
    if(typeof PDFLib==='undefined'){
      throw new Error('PDF library did not load. Connect to the internet once and reopen this page.');
    }

    const reservation=$('reservation');
    const guest=$('guest');
    const checkin=$('checkin');
    const checkout=$('checkout');
    const adults=$('adults');
    const children=$('children');
    const eur=$('eurprice');
    const usd=$('usdprice');
    const rating=$('rating');

    if(!guest || !checkin || !checkout || !adults || !eur || !usd){
      alert('Please fill Guest Name, Check-In, Check-Out, Adults, EUR Price and USD Price.');
      return;
    }

    const nights=nightsBetween(checkin,checkout);
    if(!nights){
      alert('Check-Out must be after Check-In.');
      return;
    }

    const pdfDoc=await PDFLib.PDFDocument.load(
      base64ToUint8Array(TEMPLATE_PDF_BASE64),
      {updateMetadata:false}
    );
    const page=pdfDoc.getPages()[0];
    const normal=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const bold=await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

    const rgb=PDFLib.rgb;
    const dark=rgb(0.12,0.12,0.12);
    const grey=rgb(0.42,0.42,0.42);
    const red=rgb(0.73,0.05,0.20);

    function fit(text,font,size,maxWidth,minSize=7){
      let s=size;
      while(font.widthOfTextAtSize(text,s)>maxWidth && s>minSize) s-=0.25;
      return s;
    }
    function draw(text,x,y,size=9,font=normal,color=dark,maxWidth=999){
      text=String(text||'').trim();
      if(!text) return null;
      const s=fit(text,font,size,maxWidth);
      page.drawText(text,{x,y,size:s,font,color});
      return {size:s,width:font.widthOfTextAtSize(text,s)};
    }
    function drawRight(text,rightX,y,size=9,font=normal,color=dark,maxWidth=180){
      text=String(text||'').trim();
      if(!text) return null;
      const s=fit(text,font,size,maxWidth);
      const w=font.widthOfTextAtSize(text,s);
      page.drawText(text,{x:rightX-w,y,size:s,font,color});
      return {size:s,width:w};
    }
    function wrapWords(text,font,size,maxWidth,maxLines=2){
      const words=String(text||'').trim().split(/\s+/);
      const lines=[];
      let line='';
      for(const word of words){
        const test=line ? line+' '+word : word;
        if(font.widthOfTextAtSize(test,size)<=maxWidth || !line){
          line=test;
        }else{
          lines.push(line);
          line=word;
          if(lines.length===maxLines-1) break;
        }
      }
      if(line && lines.length<maxLines) {
        const used=lines.join(' ').split(/\s+/).filter(Boolean).length;
        const remaining=words.slice(used).join(' ');
        lines.push(remaining || line);
      }
      return lines.slice(0,maxLines);
    }

    // Current date & time - automatic, same style/location as sample
    draw(currentDateTimeText(),28,775.0,7.4,normal,dark,120);

    // Reservation Number
    const rn=draw(reservation,341,690,10.2,bold,dark,102);
    if(rn){
      page.drawLine({
        start:{x:341,y:688.7},
        end:{x:341+rn.width,y:688.7},
        thickness:0.65,
        color:dark
      });
    }

    // Rating
    draw(rating,47.4,538.0,8.5,normal,grey,20);

    // Guest name: one line when it fits, otherwise two lines like the filled sample.
    const guestUpper=guest.toUpperCase();
    if(bold.widthOfTextAtSize(guestUpper,8.7)<=145){
      draw(guestUpper,39.3,480.0,8.7,bold,dark,145);
    }else{
      const lines=wrapWords(guestUpper,bold,8.7,145,2);
      if(lines[0]) draw(lines[0],39.3,480.0,8.7,bold,dark,145);
      if(lines[1]) draw(lines[1],39.3,467.8,8.7,bold,dark,145);
    }

    // Dates
    draw(hotelDate(checkin),217.0,480.0,8.7,bold,dark,145);
    draw(hotelDate(checkout),497.0,480.0,8.7,bold,dark,102);

    // Nights
    draw(`${nights} Night${Number(nights)===1?'':'s'}`,39.0,435.1,8.8,bold,red,85);

    // Adults / Children
    draw(guestCountText(adults,children),39.0,370.3,10,bold,dark,105);

    // Price summary
    const eurText=money(eur,'EUR');
    const usdText=money(usd,'USD');
    drawRight(usdText,585.0,171.7,14.0,bold,dark,95);
    drawRight(`${eurText}  (${usdText})`,585.0,142.3,13.2,bold,red,175);

    const out=await pdfDoc.save({useObjectStreams:false});
    const blob=new Blob([out],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=(reservation||'HEIDELBERG_HOTEL_RESERVATION')+'_FILLED.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);

    // Next reservation keeps 9800 and changes only the remaining 5 digits.
    setTimeout(()=>generateReservationNumber(),250);
  }catch(e){
    console.error(e);
    alert('PDF generation failed: '+e.message);
  }
}

generateReservationNumber();
loadVisaDooData();
</script>
