<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYX Athens Hotel Reservation PDF Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#182033}
.wrap{max-width:1050px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001;margin-bottom:18px}
h1{margin:0 0 8px} h2{font-size:18px;margin-top:0}
.note{font-size:13px;color:#596274;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd3df;border-radius:8px;font-size:14px}
.btn{border:0;background:#54104f;color:white;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>NYX Athens - Hotel Reservation PDF Generator</h1>
    <div class="note">Original 2-page PDF is used directly as the template. Customer details can auto-fill from sessionStorage and the generated PDF keeps the original vector/template quality.</div>
    <div style="margin-top:14px"><button type="button" class="btn" style="background:#eef1f7;color:#182033" onclick="goBackToApplication()">← Back to application</button></div>
  </div>

  <div class="card">
    <h2>Booking Details</h2>
    <div class="grid">
      <div><label>Reservation Number</label><input id="reservation" readonly></div>
      <div><label>Guest Name</label><input id="guest" placeholder="MANAL MANSOOR H A AL MANNAI"></div>
      <div><label>Check-In</label><input id="checkin" type="date"></div>
      <div><label>Check-Out</label><input id="checkout" type="date"></div>
    </div>
  </div>

  <div class="card">
    <h2>Room Details</h2>
    <div class="grid">
      <div><label>Room 1 Adults</label><input id="r1adults" type="number" min="1" value="2"></div>
      <div><label>Room 2 Adults</label><input id="r2adults" type="number" min="1" value="2"></div>
      <div><label>Room 3 Adults</label><input id="r3adults" type="number" min="1" value="1"></div>

      <div><label>Room 1 Price (USD)</label><input id="r1usd" type="number" min="0" step="0.01" placeholder="5437.95"></div>
      <div><label>Room 2 Price (USD)</label><input id="r2usd" type="number" min="0" step="0.01" placeholder="5437.95"></div>
      <div><label>Room 3 Price (USD)</label><input id="r3usd" type="number" min="0" step="0.01" placeholder="4718.36"></div>

      <div><label>Total Price (EUR)</label><input id="totaleur" type="number" min="0" step="0.01" placeholder="13696.00"></div>
      <div><label>Total Price (USD)</label><input id="totalusd" type="number" min="0" step="0.01" placeholder="15594.27"></div>
    </div>
  </div>

  <div class="card"><button class="btn" onclick="generatePDF()">Generate & Download PDF</button></div>
</div>

function generateReservationNumber(){
  let n;
  if(window.crypto && crypto.getRandomValues){
    const a=new Uint32Array(1); crypto.getRandomValues(a); n=a[0]%1000;
  } else n=Math.floor(Math.random()*1000);
  const v='P203'+String(n).padStart(3,'0');
  document.getElementById('reservation').value=v;
  return v;
}

function loadVisaDooData(){
  let data={};
  const keys=['visadoo-hotel-pdf-data','visadoo-flight-pdf-data','visadoo-pdf-data','visadoo-application-data'];
  for(const key of keys){
    try{
      const d=JSON.parse(sessionStorage.getItem(key)||'{}')||{};
      if(d && Object.keys(d).length) data={...data,...d};
    }catch(_e){}
  }
  const set=(id,v)=>{
    const e=document.getElementById(id);
    if(e && v!==undefined && v!==null && String(v).trim()!=='') e.value=String(v).trim();
  };

  set('guest',data.guest_name||data.passenger_name||data.customer_name||data.full_name||data.applicant_name||data.name);
  set('checkin',data.checkin||data.check_in||data.check_in_date||data.outbound_date||data.travel_date||data.arrival_date);
  set('checkout',data.checkout||data.check_out||data.check_out_date||data.return_date||data.departure_date);

  set('r1adults',data.room1_adults||data.r1_adults||data.adults_room1||data.adults);
  set('r2adults',data.room2_adults||data.r2_adults||data.adults_room2);
  set('r3adults',data.room3_adults||data.r3_adults||data.adults_room3);

  set('r1usd',data.room1_usd||data.room1_price_usd);
  set('r2usd',data.room2_usd||data.room2_price_usd);
  set('r3usd',data.room3_usd||data.room3_price_usd);
  set('totaleur',data.total_price_eur||data.eur_price||data.hotel_price_eur||data.total_eur);
  set('totalusd',data.total_price_usd||data.usd_price||data.hotel_price_usd||data.total_usd);
}

function goBackToApplication(){
  let data={};
  try{data=JSON.parse(sessionStorage.getItem('visadoo-hotel-pdf-data')||sessionStorage.getItem('visadoo-flight-pdf-data')||'{}')||{};}catch(_e){}
  if(data.return_hash) window.location.href='../app.html#'+data.return_hash;
  else if(history.length>1) history.back();
  else window.location.href='../app.html';
}

function b64bytes(s){
  const b=atob(s),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return u;
}

function currentDateTimeText(){
  const d=new Date();
  const date=d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
  const time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  return `${date}, ${time}`;
}

function hotelDate(v){
  if(!v)return '';
  const d=new Date(v+'T00:00:00');
  const wk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${wk[d.getDay()]}, ${mo[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function cancellationDate(v){
  if(!v)return '';
  const d=new Date(v+'T00:00:00'); d.setDate(d.getDate()-7);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mo[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function nightsBetween(a,b){
  if(!a||!b)return 0;
  const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');
  return Math.round((y-x)/86400000);
}

function peopleText(n){
  n=Number(n)||0;
  return `${n} Adult${n===1?'':'s'}`;
}

function money(v,symbol){
  const n=Number(v); if(!Number.isFinite(n))return '';
  return symbol+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function generatePDF(){
  try{
    if(!window.PDFLib) throw new Error('PDF library could not load. Connect to the internet once and reopen.');
    const guest=$('guest'),cin=$('checkin'),cout=$('checkout');
    if(!guest||!cin||!cout){alert('Please fill Guest Name, Check-In and Check-Out.');return;}
    const nights=nightsBetween(cin,cout);
    if(nights<=0){alert('Check-Out must be after Check-In.');return;}

    const pdf=await PDFLib.PDFDocument.load(b64bytes(TEMPLATE_PDF_BASE64),{updateMetadata:false});
    const pages=pdf.getPages();
    if(pages.length<2) throw new Error('Template must contain 2 pages.');
    const p1=pages[0],p2=pages[1];
    const normal=await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
    const bold=await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const rgb=PDFLib.rgb, dark=rgb(0.08,0.08,0.08), red=rgb(0.76,0.02,0.20), green=rgb(0,0.72,0.10);

    function fit(text,font,size,max,min=6){
      let s=size; while(font.widthOfTextAtSize(text,s)>max && s>min)s-=0.25; return s;
    }
    function draw(page,text,x,y,size=9,font=normal,color=dark,max=999){
      text=String(text||'').trim(); if(!text)return null;
      const s=fit(text,font,size,max);
      page.drawText(text,{x,y,size:s,font,color});
      return {size:s,width:font.widthOfTextAtSize(text,s)};
    }
    function right(page,text,rightX,y,size=9,font=normal,color=dark,max=180){
      text=String(text||'').trim(); if(!text)return;
      const s=fit(text,font,size,max),w=font.widthOfTextAtSize(text,s);
      page.drawText(text,{x:rightX-w,y,size:s,font,color});
    }

    const stamp=currentDateTimeText();
    const res=$('reservation');
    const cancel=cancellationDate(cin);

    // Page 1 - auto date/time + top header reservation
    draw(p1,stamp,24.5,769.0,7.5,normal,dark,115);
    draw(p1,res,398.0,769.0,7.3,normal,dark,48);

    // Reservation number main field
    const rn=draw(p1,res,342.0,688.3,10.4,bold,dark,86);
    if(rn) p1.drawLine({start:{x:342.0,y:686.8},end:{x:342.0+rn.width,y:686.8},thickness:0.65,color:dark});

    // Guest / dates
    draw(p1,guest.toUpperCase(),38.0,506.9,8.9,bold,dark,177);
    draw(p1,hotelDate(cin),219.0,506.9,8.9,bold,dark,142);
    draw(p1,hotelDate(cout),494.0,506.9,8.9,bold,dark,106);

    // Nights and room occupancy
    draw(p1,`${nights} Night${nights===1?'':'s'}`,40.3,475.2,8.8,bold,red,90);
    draw(p1,peopleText($('r1adults')),40.3,414.2,8.7,bold,dark,90);
    draw(p1,cancel,175.2,350.4,8.5,bold,green,90);

    draw(p1,peopleText($('r2adults')),40.3,100.8,8.7,bold,dark,90);
    draw(p1,cancel,175.2,36.5,8.5,bold,green,90);

    // Room 1/2 USD prices - sample uses the same value in both locations when entered that way.
    right(p1,money($('r1usd'),'$'),572.7,175.2,13.2,bold,dark,95);

    // Page 2 - auto date/time + top header reservation
    draw(p2,stamp,24.5,769.0,7.5,normal,dark,115);
    draw(p2,res,398.0,769.0,7.3,normal,dark,48);

    // Room 2 price at top, Room 3 occupancy/cancellation/price
    right(p2,money($('r2usd'),'$'),572.7,574.1,13.2,bold,dark,95);
    draw(p2,peopleText($('r3adults')),40.3,499.2,8.7,bold,dark,90);
    draw(p2,cancel,175.7,435.4,8.5,bold,green,90);
    right(p2,money($('r3usd'),'$'),573.1,260.2,13.2,bold,dark,95);

    // Total price
    const eur=money($('totaleur'),'€');
    const usd=money($('totalusd'),'$');
    right(p2,`${eur}  (${usd} )`,572.7,223.7,13.0,bold,red,205);

    const bytes=await pdf.save({useObjectStreams:false});
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=(res||'NYX_ATHENS_HOTEL')+'_FILLED.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);

    // Keep P203 fixed; only the final 3 digits change for the next reservation.
    setTimeout(generateReservationNumber,250);
  }catch(e){
    console.error(e);
    alert('PDF generation failed: '+e.message);
  }
}

generateReservationNumber();
loadVisaDooData();
</script>
</body>
</html>
